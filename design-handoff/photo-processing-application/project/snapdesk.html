<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PhotoFlow Desktop — Session Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0f11;
    --bg-1:#121417;
    --bg-2:#16181c;
    --bg-3:#1b1e22;
    --bg-4:#22262b;
    --line:#262a30;
    --line-soft:#1f2227;
    --line-strong:#30353c;
    --ink:#e8ecf1;
    --ink-2:#b6bdc7;
    --ink-3:#7a828d;
    --ink-4:#525861;
    --ink-5:#3a3f47;
    --accent:#3dd6c4;       /* teal/cyan */
    --accent-soft:rgba(61,214,196,0.14);
    --accent-line:rgba(61,214,196,0.45);
    --accent-ink:#0a1916;
    --warn:#e8b04a;
    --danger:#e26a6a;
    --ok:#62c87a;
    --info:#5aa8ff;
  }
  html,body{background:#000;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-ligatures:none}
  /* App canvas — 1440 x 900 */
  .app{
    width:1440px;height:900px;
    background:var(--bg);
    display:grid;
    grid-template-rows:40px 1fr 40px 24px;
    color:var(--ink);
    font-size:12.5px;
    overflow:hidden;
    border:1px solid #000;
  }
  /* generic */
  .row{display:flex;align-items:center}
  .col{display:flex;flex-direction:column}
  .gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-6{gap:24px}
  .grow{flex:1 1 auto;min-width:0}
  .muted{color:var(--ink-3)}
  .dim{color:var(--ink-4)}
  .strong{color:var(--ink)}
  .uppercase{text-transform:uppercase;letter-spacing:0.08em;font-size:10.5px;font-weight:600;color:var(--ink-3)}
  .divider{height:1px;background:var(--line-soft);width:100%}
  .vdivider{width:1px;background:var(--line-soft);height:100%}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line);border-radius:4px;font-size:11px;color:var(--ink-2);background:var(--bg-2)}
  .pill.mono{font-size:10.5px}
  .pill.accent{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
  .badge-count{display:inline-flex;min-width:22px;justify-content:center;align-items:center;padding:1px 6px;border-radius:3px;background:var(--bg-3);color:var(--ink-2);font-family:'JetBrains Mono',monospace;font-size:10.5px;border:1px solid var(--line)}
  .badge-count.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:4px;color:var(--ink-2);cursor:pointer;border:1px solid transparent;background:transparent;padding:0}
  .icon-btn:hover{background:var(--bg-3);color:var(--ink)}
  .icon-btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:4px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink-2);font-size:11.5px;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--bg-3);color:var(--ink)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .btn.primary:hover{background:#52e1d0}
  .btn.ghost{background:transparent}
  .btn.block{width:100%;justify-content:center;padding:9px 10px}
  /* layout */
  .topbar{background:var(--bg-1);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:14px;height:40px}
  .menu{display:flex;gap:2px}
  .menu-item{padding:5px 10px;border-radius:3px;color:var(--ink-2);font-size:12px;cursor:default}
  .menu-item:hover{background:var(--bg-3);color:var(--ink)}
  .body{display:grid;grid-template-columns:240px 1fr 280px;overflow:hidden;min-height:0}
  .panel{background:var(--bg);overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .panel.left{border-right:1px solid var(--line)}
  .panel.right{border-left:1px solid var(--line)}
  .panel.center{background:#0b0c0e}
  .panel-section{padding:10px 12px;border-bottom:1px solid var(--line-soft)}
  .panel-section.tight{padding:8px 12px}
  .panel-scroll{overflow-y:auto;overflow-x:hidden;min-height:0}
  /* scrollbars */
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2a2e34;border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:#3a3f47}
  /* hour row */
  .hour-row{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;cursor:pointer;border-left:2px solid transparent;gap:8px}
  .hour-row:hover{background:var(--bg-2)}
  .hour-row.selected{background:var(--accent-soft);border-left-color:var(--accent)}
  .hour-row.selected .h-time{color:var(--accent)}
  .hour-row.empty{opacity:0.45}
  .h-time{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink);letter-spacing:0.02em}
  .h-sub{font-size:10px;color:var(--ink-4);margin-top:1px}
  /* filmstrip */
  .session-group{padding:8px 12px;border-bottom:1px solid var(--line-soft)}
  .session-group:hover{background:var(--bg-1)}
  .session-group.selected{background:rgba(61,214,196,0.06)}
  .session-group.selected .sg-code{color:var(--accent)}
  .sg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .sg-code{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-2);letter-spacing:0.02em}
  .sg-time{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-4)}
  .filmstrip{display:flex;gap:3px}
  .thumb-sq{width:30px;height:30px;border-radius:2px;border:1px solid var(--line);background:#262a30;flex:0 0 auto;overflow:hidden;position:relative}
  .thumb-sq.flagged::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
  /* center */
  .session-thumbs{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg-1);align-items:center}
  .session-thumb{width:62px;height:62px;border-radius:3px;border:1px solid var(--line);overflow:hidden;cursor:pointer;position:relative;flex:0 0 auto}
  .session-thumb.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .session-thumb .st-tag{position:absolute;top:3px;left:3px;background:rgba(0,0,0,0.6);color:#fff;font-family:'JetBrains Mono',monospace;font-size:9px;padding:1px 4px;border-radius:2px}
  .session-thumb .st-ok{position:absolute;bottom:3px;right:3px;width:12px;height:12px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center}
  .session-thumb .st-warn{position:absolute;bottom:3px;right:3px;width:12px;height:12px;border-radius:50%;background:var(--warn)}
  /* before/after */
  .workbench{flex:1;display:flex;flex-direction:column;min-height:0;background:#0b0c0e}
  .compare-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;min-height:0;position:relative}
  .compare{position:relative;border:1px solid var(--line);background:#000;border-radius:3px;overflow:hidden;user-select:none}
  .compare .pane{position:absolute;inset:0}
  .compare .pane.after{clip-path:inset(0 0 0 var(--split, 50%))}
  .compare .pane.before{clip-path:inset(0 calc(100% - var(--split, 50%)) 0 0)}
  .checker{
    background-color:#fff;
    background-image:linear-gradient(45deg,#dadde2 25%,transparent 25%),linear-gradient(-45deg,#dadde2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dadde2 75%),linear-gradient(-45deg,transparent 75%,#dadde2 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0px;
  }
  .compare .splitter{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);left:calc(var(--split, 50%) - 1px);cursor:ew-resize;z-index:5}
  .compare .splitter::before{content:"";position:absolute;left:-12px;right:-12px;top:0;bottom:0}
  .compare .handle{position:absolute;left:calc(var(--split, 50%) - 14px);top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:ew-resize;box-shadow:0 4px 14px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.08) inset;z-index:6}
  .compare .label{position:absolute;top:10px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;padding:3px 7px;border-radius:2px;background:rgba(0,0,0,0.55);color:#fff;backdrop-filter:blur(4px);z-index:4}
  .compare .label.l{left:10px}
  .compare .label.r{right:10px}
  .compare .meta{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.75);z-index:4}
  .compare .meta .chip{background:rgba(0,0,0,0.55);padding:3px 7px;border-radius:2px}
  .toolbar{display:flex;align-items:center;gap:4px;padding:8px 14px;border-top:1px solid var(--line);background:var(--bg-1)}
  .toolbar .grow-spacer{flex:1}
  .tool-group{display:flex;gap:2px;padding:0 6px;border-right:1px solid var(--line);height:28px;align-items:center}
  .tool-group:last-of-type{border-right:none}
  .tool-group:first-of-type{padding-left:0}
  .zoom-readout{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-2);padding:0 8px;min-width:46px;text-align:center}
  /* right panel controls */
  .ctrl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:11.5px}
  .ctrl-row .label{color:var(--ink-2)}
  .ctrl-row .val{font-family:'JetBrains Mono',monospace;color:var(--ink);font-size:11px}
  .slider{position:relative;height:18px;display:flex;align-items:center}
  .slider .track{position:absolute;left:0;right:0;height:2px;background:#2a2e34;border-radius:1px}
  .slider .fill{position:absolute;left:0;height:2px;background:var(--accent);border-radius:1px}
  .slider .knob{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(61,214,196,0.18);transform:translateX(-50%)}
  .select{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;border:1px solid var(--line);border-radius:3px;background:var(--bg-2);color:var(--ink);font-size:11.5px;cursor:pointer;width:100%}
  .select:hover{border-color:var(--line-strong)}
  .seg{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:3px;padding:2px;gap:2px}
  .seg button{flex:1;background:transparent;border:none;color:var(--ink-3);font-size:11px;padding:5px 0;border-radius:2px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--accent-soft);color:var(--accent)}
  .input{display:flex;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:3px;padding:6px 9px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);width:100%;gap:6px}
  .input .pre{color:var(--ink-4)}
  .check{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);cursor:pointer}
  .check .box{width:13px;height:13px;border-radius:2px;border:1px solid var(--line-strong);background:var(--bg-2);display:flex;align-items:center;justify-content:center}
  .check.on .box{background:var(--accent);border-color:var(--accent)}
  /* status list */
  .status-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:11px}
  .status-item .ico{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .progress{height:4px;border-radius:2px;background:#22262b;overflow:hidden;position:relative}
  .progress .bar{height:100%;background:var(--accent)}
  /* bottom tab bar */
  .tabbar{background:var(--bg-1);border-top:1px solid var(--line);display:flex;align-items:stretch}
  .tabbar .tab{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;color:var(--ink-3);font-size:12px;cursor:pointer;border-right:1px solid var(--line);position:relative}
  .tabbar .tab:last-child{border-right:none}
  .tabbar .tab.on{color:var(--accent);background:rgba(61,214,196,0.05)}
  .tabbar .tab.on::after{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:var(--accent)}
  .tabbar .tab .fkey{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-5);padding:1px 4px;border:1px solid var(--line);border-radius:2px}
  .tabbar .tab.on .fkey{color:var(--accent);border-color:var(--accent-line)}
  /* status bar */
  .statusbar{background:var(--bg-1);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:18px;font-size:10.5px;color:var(--ink-3);font-family:'JetBrains Mono',monospace}
  .statusbar .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px rgba(98,200,122,0.18)}
  .statusbar .sep{width:1px;height:12px;background:var(--line)}
  .statusbar .spacer{flex:1}
  .statusbar .live::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:1px;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
  /* avatar */
  .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#3dd6c4,#1f6e64);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#0a1916}
  /* bar mini */
  .bars{display:flex;gap:2px;align-items:end;height:28px}
  .bars .b{width:6px;background:#2a2e34;border-radius:1px}
  .bars .b.on{background:var(--accent)}
  /* spinner */
  .spin{width:12px;height:12px;border:1.5px solid #2a2e34;border-top-color:var(--accent);border-radius:50%;animation:sp 0.9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* highlighted active session row */
  .key-readout{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-3)}
  .kbd{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-4);border:1px solid var(--line);border-radius:2px;padding:0 4px;background:var(--bg-2)}
</style>
</head>
<body>
  <div id="root"></div>

  <!-- inline SVG photo content used by App via <svg> -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="snapdesk.icons.jsx"></script>
  <script type="text/babel" src="snapdesk.photo.jsx"></script>
  <script type="text/babel" src="snapdesk.data.jsx"></script>
  <script type="text/babel" src="snapdesk.gallery.jsx"></script>
  <script type="text/babel" src="snapdesk.app.jsx"></script>
</body>
</html>
